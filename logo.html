<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Logo (exemplo) — Clínica Corpo Terra</title>
<link rel="icon" href="assets/logo-marca.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap">
<style>
body { margin: 0; font: 400 18px/1.5 "Outfit", system-ui, sans-serif; color: #00262c; background: #eef5f4; }
.w { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }
h1 { font-size: 36px; font-weight: 300; margin: 0 0 4px; } h1 b { font-weight: 700; color: #00716f; }
p { margin: 0 0 24px; color: #4c6b6e; }
.g { display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
.b { border-radius: 20px; padding: 48px 32px; display: grid; place-items: center; gap: 28px; }
.b.c { background: #fff; } .b.e { background: #00454d; } .b.m { background: #dff6f2; } .b.k { background: #fdeee3; }
.b img.h { width: 300px; max-width: 100%; }
.tam { display: flex; gap: 20px; align-items: flex-end; }
.nome { font-size: 14px; color: #4c6b6e; }
.b.e .nome { color: #9fd0cb; }
@media (max-width: 760px) { .g { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="w">
  <h1>Logo <b>de exemplo</b></h1>
  <p>Proposta inicial para a Clínica Corpo Terra: uma pessoa de braços-folha erguidos, de pé sobre a terra. É um exemplo para aprovação; o desenho final pode mudar.</p>
  <div class="g">
    <div class="b c"><img class="h" src="assets/logo.svg" alt="Logo da Clínica Corpo Terra"><span class="nome">Fundo claro</span></div>
    <div class="b e"><img class="h" src="assets/logo-claro.svg" alt="Logo da Clínica Corpo Terra, versão para fundo escuro"><span class="nome">Fundo escuro</span></div>
    <div class="b m"><div class="tam"><img src="assets/logo-marca.svg" width="128" height="128" alt=""><img src="assets/logo-marca.svg" width="64" height="64" alt=""><img src="assets/logo-marca.svg" width="32" height="32" alt=""><img src="assets/logo-marca.svg" width="16" height="16" alt=""></div><span class="nome">Só o símbolo: 128, 64, 32 e 16 px (ícone da aba)</span></div>
    <div class="b k"><img class="h" src="assets/logo.svg" alt="Logo sobre fundo creme"><span class="nome">Sobre o creme da marca</span></div>
  </div>
</div>
</body>
</html>
