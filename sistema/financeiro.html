<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Financeiro — Clínica Corpo Terra</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="sistema.css">
</head>
<body data-papel="prof" data-nav="financeiro.html" data-titulo="Financeiro" data-sub="Novembro de 2026 · valores de exemplo">
  <template id="acoes-tpl"><button class="bt sm" id="novo" type="button"><svg class="ic"><use href="#i-plus"/></svg>Novo lançamento</button></template>
  <main id="conteudo">
    <div class="stats" id="stats"></div>
    <div class="grid2">
      <div class="cd"><h3>Receita dos últimos 6 meses</h3><div class="bars" id="bars" role="img" aria-label="Receita mensal, de junho a novembro, em alta"></div></div>
      <div class="cd"><h3>Por forma de pagamento</h3><div class="gap" style="gap:10px"><div class="row"><span>Pix</span><b class="sp">62%</b></div><div class="row"><span>Cartão</span><b class="sp">31%</b></div><div class="row"><span>Outros</span><b class="sp">7%</b></div></div><p class="mu sm" style="margin-top:12px">Exemplo. Categorias e formas serão as da clínica.</p></div>
    </div>
    <div class="tbw"><table class="t"><thead><tr><th>Data</th><th>Descrição</th><th>Tipo</th><th style="text-align:right">Valor</th></tr></thead><tbody id="corpo"></tbody></table></div>

    <dialog id="dlg">
      <h3>Novo lançamento</h3>
      <form id="f-lan" method="dialog">
        <label class="fld">Descrição<input id="l-desc" required></label>
        <label class="fld">Tipo<select id="l-tipo"><option value="r">Receita</option><option value="d">Despesa</option></select></label>
        <label class="fld">Valor (R$)<input id="l-valor" type="number" min="0" step="0.01" required></label>
        <label class="fld">Data<input id="l-data" type="date" required></label>
        <div class="acoes"><button class="bt" type="submit">Lançar</button><button class="bt out" type="button" id="l-cancel">Cancelar</button></div>
      </form>
    </dialog>
  </main>
  <script src="dados.js"></script>
  <script src="sistema.js"></script>
  <script>
    (function () {
      const { D, el, $, fmtData, brl, toast } = S;
      function render() {
        const rec = D.lancamentos.filter((l) => l.tipo === 'r').reduce((s, l) => s + l.valor, 0);
        const des = D.lancamentos.filter((l) => l.tipo === 'd').reduce((s, l) => s + l.valor, 0);
        const box = $('#stats'); box.replaceChildren();
        [['Receitas', rec, 'hl'], ['Despesas', des, ''], ['Saldo do mês', rec - des, ''], ['A receber', 1200, '']].forEach(([t, v, c]) => { const d = el('div', 'stat ' + c); d.append(el('b', null, brl(v)), el('span', null, t)); box.append(d); });
        const cor = $('#corpo'); cor.replaceChildren();
        [...D.lancamentos].sort((a, b) => b.data.localeCompare(a.data)).forEach((l) => {
          const tr = el('tr'), td = el('td'); td.append(el('span', 'pl ' + (l.tipo === 'r' ? '' : 'r'), l.tipo === 'r' ? 'Receita' : 'Despesa'));
          tr.append(el('td', null, fmtData(l.data)), el('td', 'n', l.desc), td, el('td', 'v', (l.tipo === 'd' ? '− ' : '') + brl(l.valor))); cor.append(tr);
        });
      }
      const bars = $('#bars');
      D.meses.forEach(([m, v], i) => { const d = el('div'), b = el('i', i === D.meses.length - 1 ? 'cur' : ''); b.style.height = v + '%'; d.append(b, el('span', null, m)); bars.append(d); });
      $('#novo').onclick = () => { $('#l-data').value = new Date().toISOString().slice(0, 10); $('#dlg').showModal(); };
      $('#l-cancel').onclick = () => $('#dlg').close();
      $('#f-lan').onsubmit = () => {
        const v = parseFloat($('#l-valor').value); if (!(v >= 0) || !$('#l-desc').value.trim()) return;
        D.lancamentos.push({ data: $('#l-data').value, desc: $('#l-desc').value.trim(), tipo: $('#l-tipo').value, valor: v });
        $('#f-lan').reset(); render(); toast('Lançamento adicionado (só nesta tela).');
      };
      render();
    })();
  </script>
</body>
</html>
