<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Consultas — Clínica Corpo Terra</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="sistema.css">
</head>
<body data-papel="pac" data-nav="paciente-consultas.html" data-titulo="Minhas consultas" data-sub="Próximas e anteriores">
  <template id="acoes-tpl"><a class="bt sm" href="../agendar.html">Agendar nova consulta</a></template>
  <main id="conteudo">
    <div class="cd"><h3>Próximas</h3><div class="gap" id="prox" style="gap:12px"></div></div>
    <div class="cd"><h3>Anteriores</h3><div class="gap" id="ant" style="gap:12px"></div></div>
    <p class="aviso">Para remarcar ou cancelar, fale com a clínica pelo WhatsApp.</p>
  </main>
  <script src="dados.js"></script>
  <script src="sistema.js"></script>
  <script>
    (function () {
      const { D, el, $, fmtData } = S;
      function linha(c) {
        const r = el('div', 'fi'); r.style.gridTemplateColumns = '48px 1fr auto';
        const a = el('span', 'av lt', c.data.slice(8)), t = el('div'); t.append(el('b', null, c.tipo + ' · ' + c.hora), el('small', null, fmtData(c.data) + ' · Luis Manoel · online'));
        r.append(a, t, el('span', 'pl ' + (c.futura ? 'w' : 'g'), c.futura ? 'Marcada' : 'Realizada')); return r;
      }
      const f = D.consultasPaciente.filter((c) => c.futura), a = D.consultasPaciente.filter((c) => !c.futura);
      if (!f.length) $('#prox').append(el('p', 'vazio', 'Nenhuma consulta marcada.'));
      f.forEach((c) => $('#prox').append(linha(c))); a.forEach((c) => $('#ant').append(linha(c)));
    })();
  </script>
</body>
</html>
